name = "puppet-panic-grand-prix"
main = "worker/grandprix.js"
compatibility_date = "2026-10-01"

[durable_objects]
bindings = [{ name = "PARTY_ROOM", class_name = "PartyRoom" }]

[[migrations]]
tag = "grandprix-v1"
new_sqlite_classes = ["PartyRoom"]

[assets]
directory = "./dist-v2"
binding = "ASSETS"
run_worker_first = true