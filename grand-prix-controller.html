<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11192c"><title>Grand Prix — Phone Controller</title><link rel="stylesheet" href="./src/v2/grandprix.css"></head><body class="gp-phone"><main class="gp-phone-shell"><section id="join" class="gp-join"><h1>🏁 PUPPET GRAND PRIX</h1><p>YOUR PHONE IS A PUPPET CONTROLLER</p><form id="join-form"><label>ROOM CODE<input id="code" maxlength="6" placeholder="ABC123" autocapitalize="characters" required></label><label>YOUR NAME<input id="name" maxlength="24" placeholder="Your name" required></label><button id="join-button" class="gp-primary" type="submit" disabled>JOIN THE RACE</button></form><p id="join-error" role="alert"></p></section><section id="pad" hidden><header class="gp-controller-head"><div><small id="team">TEAM</small><strong id="role">YOUR ROLE</strong></div><span id="connect-status">● CONNECTING</span></header><div id="event-name">WARM UP</div><div id="job" class="gp-job">WAIT FOR YOUR ROLE</div><div class="gp-diagram-wrap"><svg id="puppet-icon" viewBox="0 0 120 145" aria-label="Your puppet with your assigned limbs highlighted"><circle cx="60" cy="24" r="18" class="figure-body"/><rect x="44" y="44" width="32" height="46" rx="10" class="figure-body"/><path id="limb-leftArm" d="M47 51 L20 89"/><path id="limb-rightArm" d="M73 51 L100 89"/><path id="limb-leftLeg" d="M49 88 L38 132"/><path id="limb-rightLeg" d="M71 88 L82 132"/></svg><span>YOUR LIMBS LIGHT UP WHEN PRESSED</span></div><div id="buttons" class="gp-pad-buttons" aria-label="Your limb controls"></div><footer><span id="cue">LOOK AT THE TV · TALK TO YOUR TEAM</span><span id="room-tag">------</span></footer><div id="new-job" hidden role="status" aria-live="assertive">NEW JOB!</div></section></main><script type="module" src="./src/v2/controller.js"></script></body></html>
