<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#101a33"/><title>PUPPET PANIC! — Phone Controller</title><link rel="stylesheet" href="./room.css"/></head>
<body class="phone-screen"><main class="phone-app">
 <section id="join-screen" class="phone-join"><div class="phone-logo">✳ PUPPET<span>PANIC!</span></div><h1>YOU ARE<br/>THE CONTROLLER.</h1><p>Look at the TV for the puppet. Keep your thumbs on your phone.</p><form id="join-form"><label>ROOM CODE<input id="join-code" placeholder="ABC123" maxlength="6" required autocomplete="off" autocapitalize="characters"/></label><label>YOUR NAME<input id="join-name" placeholder="e.g. Bongo's Left Leg" maxlength="24" required autocomplete="nickname"/></label><button type="submit" class="join-button">JOIN THE CHAOS →</button></form><p id="join-error" role="alert"></p></section>
 <section id="role-screen" class="role-screen" hidden><header class="role-top"><div class="role-team"><div id="team-indicator" class="team-dot"></div><div><strong id="team-name">TEAM BLUE</strong><span id="role-label">LEFT LEG</span></div></div><div id="connection" class="connect-status">● CONNECTED</div></header><div class="role-status"><span id="scenario">WAITING FOR THE HOST</span><strong id="cue">GET READY!</strong></div><div id="pad-area" class="pad-area" aria-label="Your assigned controls"></div><footer class="phone-footer"><span id="phone-hint">WATCH THE TV • TALK TO YOUR TEAM</span><span id="room-footer">------</span></footer></section>
</main><script type="module" src="./src/controller.js"></script></body></html>
