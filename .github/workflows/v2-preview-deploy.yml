name: Deploy isolated Grand Prix v2 preview
on:
  workflow_dispatch:
  push:
    branches: [v2-race]
    paths:
      - 'src/v2/**'
      - 'worker/**'
      - 'worker-grand-prix.toml'
      - 'grand-prix.html'
      - 'grand-prix-controller.html'
      - 'scripts/build-grandprix.js'
      - 'tests/grandprix-polish-browser.mjs'
      - 'tests/grandprix-branding-browser.mjs'
      - 'tests/grandprix-qr-empty-browser.mjs'
      - '.github/workflows/v2-preview-deploy.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: v2-race}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test and package v2 preview
        run: |
          node --test tests/*.test.js
          node scripts/build-grandprix.js
      - name: Publish independent v2 Worker and static assets
        uses: cloudflare/wrangler-action@v3
        id: cloudflare
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFARE_ACCOUNT_ID }}
          command: deploy --config worker-grand-prix.toml
          wranglerVersion: '4'
      - name: Verify isolated v2 endpoint
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 2 https://puppet-panic-grand-prix.adityasuresh2110.workers.dev/health
          curl --fail --show-error --silent --retry 5 --retry-delay 2 https://puppet-panic-grand-prix.adityasuresh2110.workers.dev/ -o /tmp/v2-host.html
          grep -q 'GRAND PRIX' /tmp/v2-host.html
      - name: Install Chromium for live deployed-asset acceptance
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify all three changes against deployed preview
        env:
          GRAND_PRIX_BASE_URL: https://puppet-panic-grand-prix.adityasuresh2110.workers.dev
        run: |
          node tests/grandprix-polish-browser.mjs
          node tests/grandprix-branding-browser.mjs
          node tests/grandprix-qr-empty-browser.mjs
